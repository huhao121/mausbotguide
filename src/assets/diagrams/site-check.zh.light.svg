<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700"><style>:root{--bg:#fdfdf7;--mask:#fdfdf7;--text:#171717;--text-muted:#6b6b6b;--arrow:#8a8a8a;--color-primary-fill:#eef4ff;--color-primary-stroke:#2f5fd0;--color-secondary-fill:#eaf6ef;--color-secondary-stroke:#1f7a55;--color-neutral-fill:#f3f3ee;--color-neutral-stroke:#8a8a8a;--color-accent-fill:#fdf5e4;--color-accent-stroke:#a86a00;--color-alert-fill:#fdeeed;--color-alert-stroke:#c0392b;} text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;}</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/></marker><marker id="arrow-secondary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--color-secondary-stroke)"/></marker><marker id="arrow-alert" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--color-alert-stroke)"/></marker></defs><rect width="100%" height="100%" fill="var(--bg)"/><rect x="30" y="20" width="700" height="40" rx="10" fill="var(--mask)"/><rect x="30" y="20" width="700" height="40" rx="10" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.4"/><text x="380" y="45" font-size="13" font-weight="600" fill="var(--text)" text-anchor="middle">每天一次，四类检查，两次才报</text><line x1="380" y1="124" x2="380" y2="150" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="380" y1="226" x2="380" y2="250" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="460" y1="296" x2="560" y2="296" stroke="var(--color-secondary-stroke)" stroke-width="1.5" marker-end="url(#arrow-secondary)"/><line x1="380" y1="342" x2="380" y2="380" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="380" y1="440" x2="380" y2="470" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="380" y1="562" x2="380" y2="590" stroke="var(--color-alert-stroke)" stroke-width="1.5" marker-end="url(#arrow-alert)"/><line x1="290" y1="516" x2="190" y2="516" stroke="var(--color-secondary-stroke)" stroke-width="1.5" marker-end="url(#arrow-secondary)"/><rect x="280" y="80" width="200" height="44" rx="22" fill="var(--mask)"/><rect x="280" y="80" width="200" height="44" rx="22" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.4"/><text x="380" y="108" font-size="13.5" font-weight="600" fill="var(--text)" text-anchor="middle">定时任务到点</text><rect x="200" y="150" width="360" height="76" rx="10" fill="var(--mask)"/><rect x="200" y="150" width="360" height="76" rx="10" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.4"/><text x="380" y="178" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">首页 · 不能缓存的页面 · 接口 · sitemap</text><text x="380" y="202" font-size="11" fill="var(--text-muted)" text-anchor="middle">状态码 · 耗时 · 证书 · 缓存时间</text><polygon points="380,250 460,296 380,342 300,296" fill="var(--mask)"/><polygon points="380,250 460,296 380,342 300,296" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.4"/><text x="380" y="301" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">有问题吗？</text><text x="470" y="289" font-size="10" fill="var(--color-secondary-stroke)" text-anchor="start">没有</text><text x="396" y="366" font-size="10" fill="var(--color-secondary-stroke)" text-anchor="start">有</text><rect x="560" y="268" width="170" height="56" rx="10" fill="var(--mask)"/><rect x="560" y="268" width="170" height="56" rx="10" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.4"/><text x="645" y="293" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">全部正常</text><text x="645" y="311" font-size="10.5" fill="var(--text-muted)" text-anchor="middle">只回一句</text><rect x="240" y="380" width="280" height="60" rx="10" fill="var(--mask)"/><rect x="240" y="380" width="280" height="60" rx="10" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.4"/><text x="380" y="406" font-size="13" font-weight="600" fill="var(--text)" text-anchor="middle">复查一次</text><text x="380" y="424" font-size="10.5" fill="var(--text-muted)" text-anchor="middle">同一个地址，再测一遍</text><polygon points="380,470 470,516 380,562 290,516" fill="var(--mask)"/><polygon points="380,470 470,516 380,562 290,516" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.4"/><text x="380" y="521" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">两次都一样？</text><text x="396" y="585" font-size="10" fill="var(--color-alert-stroke)" text-anchor="start">一样</text><text x="218" y="505" font-size="10" fill="var(--color-secondary-stroke)" text-anchor="start">不一样</text><rect x="40" y="488" width="150" height="56" rx="10" fill="var(--mask)"/><rect x="40" y="488" width="150" height="56" rx="10" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.4"/><text x="115" y="513" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">这一轮不报</text><text x="115" y="531" font-size="10.5" fill="var(--text-muted)" text-anchor="middle">先记下来</text><rect x="280" y="590" width="200" height="50" rx="25" fill="var(--mask)"/><rect x="280" y="590" width="200" height="50" rx="25" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="1.4"/><text x="380" y="620" font-size="13" font-weight="600" fill="var(--text)" text-anchor="middle">报故障</text><text x="380" y="672" font-size="11" fill="var(--text-muted)" text-anchor="middle">两次结果不一样，这一轮先不报。</text></svg>
