<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300"><style>:root{--bg:#09090b;--mask:#09090b;--text:#fafafa;--text-muted:#a1a1aa;--arrow:#71717a;--color-primary-fill:#131b2b;--color-primary-stroke:#8fb3f5;--color-secondary-fill:#10211a;--color-secondary-stroke:#7fcfa9;--color-neutral-fill:#18181b;--color-neutral-stroke:#71717a;--color-accent-fill:#231c0f;--color-accent-stroke:#e3b964;--color-alert-fill:#2a1515;--color-alert-stroke:#ef9a94;--bar:#3f3f46;--bar-strong:#fafafa;--gridline:#1f1f23;} text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;}</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/></marker><marker id="arrow-alert" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--color-alert-stroke)"/></marker><marker id="arrow-secondary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--color-secondary-stroke)"/></marker><marker id="arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--color-primary-stroke)"/></marker></defs><rect width="100%" height="100%" fill="var(--bg)"/><line x1="180" y1="79" x2="248" y2="75" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="180" y1="79" x2="248" y2="195" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><line x1="180" y1="199" x2="248" y2="75" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="180" y1="199" x2="248" y2="195" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><line x1="500" y1="75" x2="558" y2="120" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="500" y1="195