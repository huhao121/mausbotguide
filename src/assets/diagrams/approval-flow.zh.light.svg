<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470"><style>:root{--bg:#fdfdf7;--mask:#fdfdf7;--text:#171717;--text-muted:#6b6b6b;--arrow:#8a8a8a;--color-primary-fill:#eef4ff;--color-primary-stroke:#2f5fd0;--color-secondary-fill:#eaf6ef;--color-secondary-stroke:#1f7a55;--color-neutral-fill:#f3f3ee;--color-neutral-stroke:#8a8a8a;--color-accent-fill:#fdf5e4;--color-accent-stroke:#a86a00;--color-alert-fill:#fdeeed;--color-alert-stroke:#c0392b;--gridline:#e8e8e2;} text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;}</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/></marker></defs><rect width="100%" height="100%" fill="var(--bg)"/><line x1="400" y1="60" x2="498" y2="63" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="250" y1="106" x2="250" y2="204" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="400" y1="250" x2="498" y2="251" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="250" y1="296" x2="180" y2="358" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><polygon points="250,14.0 400.0,60 250,106.0 100.0,60" fill="var(--mask)"/><polygon points="250,14.0 400.0,60 250,106.0 100.0,60" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.4"/><text x="250.0" y="54.0" font-size="13" font-weight="600" fill="var(--text)" text-anchor="middle">它会碰生产环境吗？</text><text x="250.0" y="71.0" font-size="11" font-weight="400" fill="var(--text-muted)" text-anchor="middle">能部署、能动数据库</text><text x="250.0" y="88.0" font-size="11" font-weight="400" fill="var(--text-muted)" text-anchor="middle">能改线上配置</text><rect x="500" y="34" width="180" height="58" rx="10" fill="var(--mask)"/><rect x="500" y="34" width="180" height="58" rx="10" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.4"/><text x="590.0" y="61.0" font-size="13.5" font-weight="600" fill="var(--text)" text-anchor="middle">完全访问</text><text x="590.0" y="79.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">定时任务、聊天、写作都够用</text><text x="430.0" y="50.0" font-size="11.5" font-weight="500" fill="var(--text-muted)" text-anchor="start">否</text><polygon points="250,204.0 400.0,250 250,296.0 100.0,250" fill="var(--mask)"/><polygon points="250,204.0 400.0,250 250,296.0 100.0,250" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.4"/><text x="250.0" y="244.0" font-size="13" font-weight="600" fill="var(--text)" text-anchor="middle">有人在旁边批卡片吗？</text><text x="250.0" y="261.0" font-size="11" font-weight="400" fill="var(--text-muted)" text-anchor="middle">定时任务、webhook 通常没人看着</text><text x="250.0" y="278.0" font-size="11" font-weight="400" fill="var(--text-muted)" text-anchor="middle">没人点，它就会一直卡住</text><text x="258.0" y="160.0" font-size="11.5" font-weight="500" fill="var(--text-muted)" text-anchor="start">是</text><rect x="500" y="222" width="180" height="58" rx="10" fill="var(--mask)"/><rect x="500" y="222" width="180" height="58" rx="10" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="1.4"/><text x="590.0" y="249.0" font-size="13.5" font-weight="600" fill="var(--text)" text-anchor="middle">请求批准</text><text x="590.0" y="267.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">命令和改文件都先问你</text><text x="430.0" y="240.0" font-size="11.5" font-weight="500" fill="var(--text-muted)" text-anchor="start">是</text><rect x="30" y="360" width="300" height="58" rx="10" fill="var(--mask)"/><rect x="30" y="360" width="300" height="58" rx="10" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.4"/><text x="180.0" y="387.0" font-size="13.5" font-weight="600" fill="var(--text)" text-anchor="middle">只读账号</text><text x="180.0" y="405.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">没人看着时，让它根本改不了</text><text x="226.0" y="336.0" font-size="11.5" font-weight="500" fill="var(--text-muted)" text-anchor="start">否</text><text x="360.0" y="444.0" font-size="11.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">「自动接受编辑」只有部分引擎提供（Claude、Antigravity、Grok）；OpenCode 和 Codex 用 ask 或 full。</text></svg>