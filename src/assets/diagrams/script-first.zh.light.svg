<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660"><style>:root{--bg:#fdfdf7;--mask:#fdfdf7;--text:#171717;--text-muted:#6b6b6b;--arrow:#8a8a8a;--color-primary-fill:#eef4ff;--color-primary-stroke:#2f5fd0;--color-secondary-fill:#eaf6ef;--color-secondary-stroke:#1f7a55;--color-neutral-fill:#f3f3ee;--color-neutral-stroke:#8a8a8a;--color-accent-fill:#fdf5e4;--color-accent-stroke:#a86a00;--color-alert-fill:#fdeeed;--color-alert-stroke:#c0392b;} text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;}</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/></marker><marker id="arrow-secondary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--color-secondary-stroke)"/></marker></defs><rect width="100%" height="100%" fill="var(--bg)"/><rect x="30" y="24" width="700" height="40" rx="10" fill="var(--mask)"/><rect x="30" y="24" width="700" height="40" rx="10" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.4"/><text x="380" y="49" font-size="13" font-weight="600" fill="var(--text)" text-anchor="middle">脚本先跑，模型少走几步</text><line x1="380" y1="138" x2="380" y2="170" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="380" y1="234" x2="380" y2="254" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="460" y1="300" x2="560" y2="300" stroke="var(--color-secondary-stroke)" stroke-width="1.5" marker-end="url(#arrow-secondary)"/><line x1="380" y1="346" x2="380" y2="390" stroke="var(--color-secondary-stroke)" stroke-width="1.5" marker-end="url(#arrow-secondary)"/><line x1="380" y1="462" x2="380" y2="510" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="280" y="90" width="200" height="48" rx="24" fill="var(--mask)"/><rect x="280" y="90" width="200" height="48" rx="24" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.4"/><text x="380" y="120" font-size="13.5" font-weight="600" fill="var(--text)" text-anchor="middle">定时任务到点</text><rect x="230" y="170" width="300" height="64" rx="10" fill="var(--mask)"/><rect x="230" y="170" width="300" height="64" rx="10" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.4"/><text x="380" y="196" font-size="13.5" font-weight="600" fill="var(--text)" text-anchor="middle">脚本跑一遍</text><text x="380" y="215" font-size="11" fill="var(--text-muted)" text-anchor="middle">抓取 · 去重 · 比对 · 输出摘要</text><polygon points="380,254 460,300 380,346 300,300" fill="var(--mask)"/><polygon points="380,254 460,300 380,346 300,300" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.4"/><text x="380" y="305" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">有变化吗？</text><text x="470" y="293" font-size="10" fill="var(--color-secondary-stroke)" text-anchor="start">没有</text><text x="396" y="372" font-size="10" fill="var(--color-secondary-stroke)" text-anchor="start">有</text><rect x="560" y="272" width="170" height="56" rx="10" fill="var(--mask)"/><rect x="560" y="272" width="170" height="56" rx="10" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.4"/><text x="645" y="297" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">回一句，结束</text><text x="645" y="315" font-size="10.5" fill="var(--text-muted)" text-anchor="middle">模型只回一句</text><rect x="230" y="390" width="300" height="72" rx="10" fill="var(--mask)"/><rect x="230" y="390" width="300" height="72" rx="10" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.4"/><text x="380" y="417" font-size="13.5" font-weight="600" fill="var(--text)" text-anchor="middle">交给模型判断</text><text x="380" y="436" font-size="10.5" fill="var(--text-muted)" text-anchor="middle">重不重要 · 为什么 · 要不要叫你</text><rect x="280" y="510" width="200" height="50" rx="25" fill="var(--mask)"/><rect x="280" y="510" width="200" height="50" rx="25" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.4"/><text x="380" y="540" font-size="13" font-weight="600" fill="var(--text)" text-anchor="middle">发一条报告</text><text x="380" y="610" font-size="11" fill="var(--text-muted)" text-anchor="middle">没有变化时，模型只走几步，不做分析。</text></svg>
