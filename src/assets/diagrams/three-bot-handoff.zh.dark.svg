<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520"><style>:root{--bg:#09090b;--mask:#09090b;--text:#fafafa;--text-muted:#a1a1aa;--arrow:#71717a;--color-primary-fill:#131b2b;--color-primary-stroke:#8fb3f5;--color-secondary-fill:#10211a;--color-secondary-stroke:#7fcfa9;--color-neutral-fill:#18181b;--color-neutral-stroke:#71717a;--color-accent-fill:#231c0f;--color-accent-stroke:#e3b964;--gridline:#1f1f23;} text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;}</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/></marker><marker id="arrow-muted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--text-muted)"/></marker></defs><rect width="100%" height="100%" fill="var(--bg)"/><line x1="24" y1="500" x2="956" y2="500" stroke="var(--gridline)" stroke-width="1"/>

<text x="24" y="30" font-size="16" font-weight="700" fill="var(--text)">一份活，三个 Bot</text>
<text x="24" y="50" font-size="10" fill="var(--text-muted)">你只对总协调说话。它派活、验收，再回你。</text>

