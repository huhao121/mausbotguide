<rect x="230" y="60" width="150" height="44" rx="8" fill="var(--mask)"/><rect x="230" y="60" width="150" height="44" rx="8" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.4"/><text x="305" y="87" font-size="11" font-weight="600" text-anchor="middle" fill="var(--text)">Alder · 总协调</text>

