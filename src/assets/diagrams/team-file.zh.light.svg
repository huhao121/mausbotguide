<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300"><style>:root{--bg:#fdfdf7;--mask:#fdfdf7;--text:#171717;--text-muted:#6b6b6b;--arrow:#8a8a8a;--color-primary-fill:#eef4ff;--color-primary-stroke:#2f5fd0;--color-secondary-fill:#eaf6ef;--color-secondary-stroke:#1f7a55;--color-neutral-fill:#f3f3ee;--color-neutral-stroke:#8a8a8a;--color-accent-fill:#fdf5e4;--color-accent-stroke:#a86a00;--color-alert-fill:#fdeeed;--color-alert-stroke:#c0392b;--gridline:#e8e8e2;} text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;}</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/></marker></defs><rect width="100%" height="100%" fill="var(--bg)"/><line x1="180" y1="132" x2="228" y2="70" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="180" y1="145" x2="228" y2="145" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="180" y1="158" x2="228" y2="228" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="430" y1="145" x2="478" y2="145" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="110" width="150" height="70" rx="10" fill="var(--mask)"/><rect x="30" y="110" width="150" height="70" rx="10" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.4"/><text x="105.0" y="150.4" font-size="15" font-weight="600" fill="var(--text)" text-anchor="middle">team.yaml</text><rect x="230" y="40" width="200" height="60" rx="10" fill="var(--mask)"/><rect x="230" y="40" width="200" height="60" rx="10" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="1.4"/><text x="330.0" y="68.0" font-size="13.5" font-weight="600" fill="var(--text)" text-anchor="middle">defaults</text><text x="330.0" y="86.0" font-size="10" font-weight="400" fill="var(--tex