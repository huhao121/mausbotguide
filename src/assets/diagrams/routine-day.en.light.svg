<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340"><style>:root{--bg:#fdfdf7;--mask:#fdfdf7;--text:#171717;--text-muted:#6b6b6b;--arrow:#8a8a8a;--color-primary-fill:#eef4ff;--color-primary-stroke:#2f5fd0;--color-secondary-fill:#eaf6ef;--color-secondary-stroke:#1f7a55;--color-neutral-fill:#f3f3ee;--color-neutral-stroke:#8a8a8a;--color-accent-fill:#fdf5e4;--color-accent-stroke:#a86a00;--color-alert-fill:#fdeeed;--color-alert-stroke:#c0392b;--gridline:#e8e8e2;} text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;}</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/></marker></defs><rect width="100%" height="100%" fill="var(--bg)"/><line x1="60" y1="150" x2="660" y2="150" stroke="var(--arrow)" stroke-width="1.5"/><line x1="654" y1="157" x2="600" y2="234" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="30.0" y="30.0" font-size="14" font-weight="700" fill="var(--text)" text-anchor="start">One routine, one day</text><circle cx="72.0" cy="150" r="7" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="2"/><text x="72.0" y="126.0" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">08:00</text><text x="72.0" y="106.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">plugged in, the </text><text x="72.0" y="92.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">app blocks idle </text><text x="72.0" y="78.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">sleep an hour ah</text><circle cx="264.0" cy="150" r="7" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="2"/><text x="264.0" y="126.0" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">09:00</text><text x="264.0" y="106.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">the bot wakes, r</text><text x="264.0" y="92.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">uns its script (</text><text x="264.0" y="78.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">19 steps, under </text><circle cx="444.0" cy="150" r="7" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="2"/><text x="444.0" y="126.0" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">09:03</text><text x="444.0" y="106.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">one message if s</text><text x="444.0" y="92.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">omething changed</text><text x="444.0" y="78.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">, one line if no</text><circle cx="600.0" cy="150" r="7" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="2"/><text x="600.0" y="126.0" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">failure</text><text x="600.0" y="106.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">retries once in </text><text x="600.0" y="92.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">the same convers</text><text x="600.0" y="78.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">ation after 15 s</text><rect x="470" y="236" width="220" height="62" rx="10" fill="var(--mask)"/><rect x="470" y="236" width="220" height="62" rx="10" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="1.4"/><text x="580.0" y="265.0" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">fails again</text><text x="580.0" y="283.0" font-size="10" font-weight="400" fill="var(--text-muted)" text-anchor="middle">one notification saying why; no more retries</text></svg>