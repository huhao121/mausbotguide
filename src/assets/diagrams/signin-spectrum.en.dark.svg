<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240"><style>:root{--bg:#09090b;--mask:#09090b;--text:#fafafa;--text-muted:#a1a1aa;--arrow:#71717a;--color-primary-fill:#131b2b;--color-primary-stroke:#8fb3f5;--color-secondary-fill:#10211a;--color-secondary-stroke:#7fcfa9;--color-neutral-fill:#18181b;--color-neutral-stroke:#71717a;--color-accent-fill:#231c0f;--color-accent-stroke:#e3b964;--color-alert-fill:#2a1515;--color-alert-stroke:#ef9a94;--gridline:#1f1f23;} text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;}</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/></marker></defs><rect width="100%" height="100%" fill="var(--bg)"/><line x1="181" y1="103" x2="193" y2="103" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="345" y1="103" x2="357" y2="103" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="509" y1="103" x2="521" y2="103" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30.0" y="30.0" font-size="14" font-weight="700" fill="var(--text)" text-anchor="start">Signing an engine in on a server: easiest to hardest</text><rect x="30" y="60" width="150" height="86" rx="10" fill="var(--mask)"/><rect x="30" y="60" width="150" height="86" rx="10" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.4"/><text x="105.0" y="101.0" font-size="13.5" font-weight="600" fill="var(--text)" text-anchor="middle">Device code</text><text x="105.0" y="119.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">Codex, Kimi</text><rect x="194" y="60" width="150" height="86" rx="10" fill="var(--mask)"/><rect x="194" y="60" width="150" height="86" rx="10" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.4"/><text x="269.0" y="101.0" font-size="13.5" font-weight="600" fill="var(--text)" text-anchor="middle">API key</text><text x="269.0" y="119.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">OpenCode, DeepSeek</text><rect x="358" y="60" width="150" height="86" rx="10" fill="var(--mask)"/><rect x="358" y="60" width="150" height="86" rx="10" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.4"/><text x="433.0" y="101.0" font-size="13.5" font-weight="600" fill="var(--text)" text-anchor="middle">Open a link, paste a code</text><text x="433.0" y="119.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">Claude Code</text><rect x="522" y="60" width="150" height="86" rx="10" fill="var(--mask)"/><rect x="522" y="60" width="150" height="86" rx="10" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="1.4"/><text x="597.0" y="101.0" font-size="13.5" font-weight="600" fill="var(--text)" text-anchor="middle">Browser sign-in, paste the callback</text><text x="597.0" y="119.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">Antigravity (Gemini)</text><text x="30.0" y="186.0" font-size="11.5" font-weight="400" fill="var(--text-muted)" text-anchor="start">Start at the easy end: send one real message to prove the path, then take on the hard ones.</text></svg>