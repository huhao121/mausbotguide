<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340"><style>:root{--bg:#09090b;--mask:#09090b;--text:#fafafa;--text-muted:#a1a1aa;--arrow:#71717a;--color-primary-fill:#131b2b;--color-primary-stroke:#8fb3f5;--color-secondary-fill:#10211a;--color-secondary-stroke:#7fcfa9;--color-neutral-fill:#18181b;--color-neutral-stroke:#71717a;--color-accent-fill:#231c0f;--color-accent-stroke:#e3b964;--color-alert-fill:#2a1515;--color-alert-stroke:#ef9a94;--gridline:#1f1f23;} text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;}</style><defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/></marker></defs><rect width="100%" height="100%" fill="var(--bg)"/><line x1="60" y1="150" x2="660" y2="150" stroke="var(--arrow)" stroke-width="1.5"/><line x1="654" y1="157" x2="600" y2="234" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="30.0" y="30.0" font-size="14" font-weight="700" fill="var(--text)" text-anchor="start">一个定时任务的一天</text><circle cx="72.0" cy="150" r="7" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="2"/><text x="72.0" y="126.0" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">08:00</text><text x="72.0" y="106.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">插着电时，提前一小时阻止空闲睡眠</text><circle cx="264.0" cy="150" r="7" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="2"/><text x="264.0" y="126.0" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">09:00</text><text x="264.0" y="106.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">到点唤醒 Bot，跑脚本（19 </text><text x="264.0" y="92.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">步，不到 3 分钟）</text><circle cx="444.0" cy="150" r="7" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="2"/><text x="444.0" y="126.0" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">09:03</text><text x="444.0" y="106.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">有变化才发一条，没有就回一句「正</text><text x="444.0" y="92.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">常」</text><circle cx="600.0" cy="150" r="7" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="2"/><text x="600.0" y="126.0" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">失败</text><text x="600.0" y="106.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">15 秒后同一会话重试一次；限流</text><text x="600.0" y="92.0" font-size="10.5" font-weight="400" fill="var(--text-muted)" text-anchor="middle">则等 1 分钟</text><rect x="470" y="236" width="220" height="62" rx="10" fill="var(--mask)"/><rect x="470" y="236" width="220" height="62" rx="10" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="1.4"/><text x="580.0" y="265.0" font-size="12.5" font-weight="600" fill="var(--text)" text-anchor="middle">还是失败</text><text x="580.0" y="283.0" font-size="10" font-weight="400" fill="var(--text-muted)" text-anchor="middle">通知你一次，说明原因，不再重试</text></svg>