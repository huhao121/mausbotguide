<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800"><style>:root{--bg:#09090b;--mask:#09090b;--text:#fafafa;--text-muted:#a1a1aa;--arrow:#71717a;--color-primary-fill:#131b2b;--color-primary-stroke:#8fb3f5;--color-secondary-fill:#10211a;--color-secondary-stroke:#7fcfa9;--color-neutral-fill:#18181b;--color-neutral-stroke:#71717a;--color-accent-fill:#231c0f;--color-accent-stroke:#e3b964;--color-alert-fill:#2a1515;--color-alert-stroke:#ef9a94;}text{font-family:-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Segoe UI', Roboto, sans-serif;}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/></marker></defs>
<rect width="100%" height="100%" fill="var(--bg)"/>
<g fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)">
  <path d="M 298 70 L 150 70 L 150 128"/>
  <path d="M 462 70 L 610 70 L 610 128"/>
  <path d="M 610 190 L 610 228"/>
  <path d="M 610 290 L 610 328"/>
  <path d="M 150 190 L 150 460 L 268 460"/>
  <path d="M 610 390 L 610 460 L 492 460"/>
  <path d="M 380 490 L 380 528"/>
  <path d="M 380 590 L 380 618"/>
  <path d="M 380 680 L 380 708"/>
</g>
<g transform="translate(380,70)">
  <polygon points="0,-44 82,0 0,44 -82,0" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.5"/>
  <text y="5" fill="var(--text)" font-size="13" font-weight="600" text-anchor="middle">Where does it run?</text>
</g>

  <rect x="40" y="130" width="220" height="60" rx="8" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="1.5"/>
  <text x="150" y="156" fill="var(--text)" font-size="14" font-weight="600" text-anchor="middle">Desktop or MausBot Cloud</text>
  <text x="150" y="176" fill="var(--text-muted)" font-size="12" text-anchor="middle">no key needed</text>

  <rect x="500" y="130" width="220" height="60" rx="8" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="1.5"/>
  <text x="610" y="156" fill="var(--text)" font-size="14" font-weight="600" text-anchor="middle">Self-hosted server</text>
  <text x="610" y="176" fill="var(--text-muted)" font-size="12" text-anchor="middle">your own Composio project</text>

  <rect x="500" y="230" width="220" height="60" rx="8" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="1.5"/>
  <text x="610" y="256" fill="var(--text)" font-size="14" font-weight="600" text-anchor="middle">Get a project key</text>
  <text x="610" y="276" fill="var(--text-muted)" font-size="12" text-anchor="middle">Composio: starts with ak_</text>

  <rect x="500" y="330" width="220" height="60" rx="8" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="1.5"/>
  <text x="610" y="356" fill="var(--text)" font-size="14" font-weight="600" text-anchor="middle">Save the key</text>
  <text x="610" y="376" fill="var(--text-muted)" font-size="12" text-anchor="middle">Settings → API keys</text>

  <rect x="270" y="430" width="220" height="60" rx="8" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
  <text x="380" y="456" fill="var(--text)" font-size="14" font-weight="600" text-anchor="middle">Click Connect on Gmail</text>
  <text x="380" y="476" fill="var(--text-muted)" font-size="12" text-anchor="middle">Connect apps → search Gmail</text>

  <rect x="270" y="530" width="220" height="60" rx="8" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.5"/>
  <text x="380" y="556" fill="var(--text)" font-size="14" font-weight="600" text-anchor="middle">Sign in to Google</text>
  <text x="380" y="576" fill="var(--text-muted)" font-size="12" text-anchor="middle">only you can do this</text>

  <rect x="270" y="620" width="220" height="60" rx="8" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
  <text x="380" y="646" fill="var(--text)" font-size="14" font-weight="600" text-anchor="middle">Limit tools per bot</text>
  <text x="380" y="666" fill="var(--text-muted)" font-size="12" text-anchor="middle">Bot settings → Access</text>

  <rect x="260" y="710" width="240" height="60" rx="8" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
  <text x="380" y="736" fill="var(--text)" font-size="14" font-weight="600" text-anchor="middle">Ask for three unread emails</text>
  <text x="380" y="756" fill="var(--text-muted)" font-size="12" text-anchor="middle">real senders and subjects</text>
</svg>
